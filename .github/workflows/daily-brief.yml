name: Daily Brief（X 情报站每日简报）

# 备份通道：仅手动触发（Run workflow）。日常 07:00 定时生产由 Muse 侧任务
# 经 SSH Deploy Key 直接推送承担（2026-11-05 用户定版），避免双通道同时发布互相覆盖。
on:
  workflow_dispatch:
    inputs:
      backfill_date:
        description: "可选：补跑指定日期（YYYY-MM-DD），留空为当天"
        required: false
        type: string

permissions:
  contents: write # 提交简报文件
  models: read # 调用 GitHub Models 免费推理

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install twscrape

      - name: Collect（采集：AIHOT / NewsNow 热榜 / X）
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          BRIEF_DATE: ${{ inputs.backfill_date }}
        run: python scripts/collect.py

      - name: Generate（生成：GitHub Models 选题摘要 + 模板渲染）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEF_DATE: ${{ inputs.backfill_date }}
        run: python scripts/generate.py

      - name: Commit & Push（有变更才提交）
        env:
          BACKFILL_DATE: ${{ inputs.backfill_date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            DATE="$BACKFILL_DATE"
          else
            DATE=$(TZ=Asia/Shanghai date +%F)
          fi
          echo "目标日期：$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "briefs/${DATE}.html" index.html archive.html sw.js
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "brief: ${DATE}"
            git push
          fi

      - name: Summary（运行摘要）
        if: always()
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print("## 每日简报流水线摘要")
          for name, label in (("data/collect_meta.json", "采集"), ("data/generate_meta.json", "生成")):
              if os.path.exists(name):
                  meta = json.load(open(name, encoding="utf-8"))
                  print(f"### {label}")
                  print(f"```json\n{json.dumps(meta, ensure_ascii=False, indent=1)}\n```")
              else:
                  print(f"### {label}\n（无 {name}，该步骤可能未完成）")
          PYEOF

      - name: Upload data artifacts（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-data-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 7
